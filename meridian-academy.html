  var CSV_COLUMNS = [
    { key: 'name', header: 'Course Name', required: true },
    { key: 'category', header: 'Category', required: false, def: 'Uncategorized' },
    { key: 'vendor', header: 'Vendor', required: false, def: 'Internal' },
    { key: 'start', header: 'Start Date', required: true },
    { key: 'end', header: 'End Date', required: true },
    { key: 'hours', header: 'Scheduled Hours', required: true, numeric: true },
    { key: 'cost', header: 'Cost Per Seat', required: false, numeric: true, def: 0 },
    { key: 'enrolled', header: 'Enrolled', required: true, numeric: true },
    { key: 'completed', header: 'Completed', required: false, numeric: true, def: 0 },
    { key: 'notCompleted', header: 'Not Completed', required: false, numeric: true, def: 0 },
    { key: 'avgHours', header: 'Avg Hours Logged', required: false, numeric: true, def: 0 }
  ];

  function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function parseCSV(text) {
    var rows = [], field = '', row = [], inQuotes = false;
    text = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else { field += ch; }
      } else if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += ch; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return !(r.length === 1 && r[0].trim() === ''); });
  }

  function parseCourseRows(text) {
    var rows = parseCSV(text);
    var errors = [], warnings = [], courses = [];
    if (rows.length === 0) { errors.push('The file is empty.'); return { courses: courses, errors: errors, warnings: warnings }; }

    var headerRow = rows[0].map(normalizeHeader);
    var colIndex = {};
    CSV_COLUMNS.forEach(function (col) {
      var idx = headerRow.indexOf(normalizeHeader(col.header));
      if (idx >= 0) colIndex[col.key] = idx;
    });
    var missingRequired = CSV_COLUMNS.filter(function (c) { return c.required && colIndex[c.key] === undefined; });
    if (missingRequired.length) {
      errors.push('Missing required column(s): ' + missingRequired.map(function (c) { return c.header; }).join(', '));
      return { courses: courses, errors: errors, warnings: warnings };
    }

    for (var r = 1; r < rows.length; r++) {
      var raw = rows[r];
      if (raw.every(function (v) { return v.trim() === ''; })) continue;
      var rowNum = r + 1;
      var rec = {};
      var rowErr = null;
      CSV_COLUMNS.forEach(function (col) {
        var idx = colIndex[col.key];
        var val = idx === undefined ? '' : (raw[idx] || '').trim();
        if (val === '') {
          if (col.required) rowErr = 'missing "' + col.header + '"';
          rec[col.key] = col.numeric ? (col.def || 0) : (col.def || '');
          return;
        }
        if (col.numeric) {
          var n = parseFloat(val.replace(/[$,]/g, ''));
          if (isNaN(n)) { rowErr = 'invalid number for "' + col.header + '" ("' + val + '")'; }
          rec[col.key] = isNaN(n) ? 0 : n;
        } else if (col.key === 'start' || col.key === 'end') {
          var dt = parseISO(val);
          if (isNaN(dt.getTime())) { rowErr = 'invalid date for "' + col.header + '" ("' + val + '")'; }
          rec[col.key] = val;
        } else {
          rec[col.key] = val;
        }
      });
      if (rowErr) { errors.push('Row ' + rowNum + ': ' + rowErr + ' — skipped.'); continue; }
      if (rec.completed + rec.notCompleted > rec.enrolled) {
        warnings.push('Row ' + rowNum + ' ("' + rec.name + '"): completed + not completed exceeds enrolled — kept as entered.');
      }
      courses.push(rec);
    }
    if (courses.length === 0 && errors.length === 0) errors.push('No data rows found.');
    return { courses: courses, errors: errors, warnings: warnings };
  }

  function buildTemplateCSV(courses) {
    var header = CSV_COLUMNS.map(function (c) { return c.header; });
    function esc(v) {
      v = String(v == null ? '' : v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }
    var lines = [header.map(esc).join(',')];
    courses.forEach(function (c) {
      lines.push(CSV_COLUMNS.map(function (col) { return esc(c[col.key]); }).join(','));
    });
    return lines.join('\n');
  }

  // =====================================================================
  // Enrichment, aggregation, insights
  // =====================================================================

  function enrichCourse(raw, today) {
    var c = {
      name: raw.name, category: raw.category || 'Uncategorized', vendor: raw.vendor || 'Internal',
      start: raw.start, end: raw.end,
      startDate: parseISO(raw.start), endDate: parseISO(raw.end),
      hours: Number(raw.hours) || 0, cost: Number(raw.cost) || 0,
      enrolled: Number(raw.enrolled) || 0,
      completed: Number(raw.completed) || 0, notCompleted: Number(raw.notCompleted) || 0,
      avgHours: Number(raw.avgHours) || 0
    };
    var durMs = c.endDate - c.startDate;
    c.durationDays = Math.max(1, Math.round(durMs / 86400000));
    if (isNaN(c.startDate.getTime()) || isNaN(c.endDate.getTime())) c.phase = 'unknown';
    else if (today < c.startDate) c.phase = 'upcoming';
    else if (today > c.endDate) c.phase = 'ended';
    else c.phase = 'in-progress';
    c.totalCost = c.cost * c.enrolled;
    c.completionRate = (c.completed + c.notCompleted) > 0 ? c.completed / (c.completed + c.notCompleted) : null;
    c.paceRatio = null;
    if (c.phase === 'in-progress' && c.hours > 0) {
      c.elapsedFraction = Math.min(1, Math.max(0.02, (today - c.startDate) / durMs));
      c.paceRatio = (c.avgHours / c.hours) / c.elapsedFraction;
    }
    c.totalHoursConsumed = c.avgHours * c.enrolled;
    if (c.phase === 'upcoming') c.status = { label: 'Upcoming', tone: 'neutral' };
    else if (c.phase === 'in-progress') {
      c.status = (c.paceRatio !== null && c.paceRatio < 0.8) ? { label: 'Off pace', tone: 'caution' } : { label: 'In progress', tone: 'neutral' };
    } else if (c.phase === 'ended') {
      if (c.completionRate === null) c.status = { label: 'No data', tone: 'neutral' };
      else if (c.completionRate < 0.65) c.status = { label: 'At risk', tone: 'warn' };
      else if (c.completionRate < 0.85) c.status = { label: 'Needs review', tone: 'caution' };
      else c.status = { label: 'Complete', tone: 'good' };
    } else c.status = { label: 'Unknown dates', tone: 'neutral' };
    return c;
  }

  function computeAggregates(courses) {
    var ended = courses.filter(function (c) { return c.phase === 'ended' && c.completionRate !== null; });
    var totalCompleted = ended.reduce(function (a, c) { return a + c.completed; }, 0);
    var totalNotCompleted = ended.reduce(function (a, c) { return a + c.notCompleted; }, 0);
    var overallCompletionRate = (totalCompleted + totalNotCompleted) > 0 ? totalCompleted / (totalCompleted + totalNotCompleted) : 0;
    var totalEnrollments = courses.reduce(function (a, c) { return a + c.enrolled; }, 0);
    var totalSpend = courses.reduce(function (a, c) { return a + c.totalCost; }, 0);
    var atRiskCourses = courses.filter(function (c) { return c.status.tone === 'warn'; });

    var vendorSpend = {};
    courses.forEach(function (c) {
      if (c.vendor === 'Internal') return;
      vendorSpend[c.vendor] = vendorSpend[c.vendor] || { cost: 0, count: 0 };
      vendorSpend[c.vendor].cost += c.totalCost;
      vendorSpend[c.vendor].count += 1;
    });
    var vendorList = Object.keys(vendorSpend).map(function (v) {
      return { name: v, cost: vendorSpend[v].cost, count: vendorSpend[v].count };
    }).sort(function (a, b) { return b.cost - a.cost; });
    var externalSpendTotal = vendorList.reduce(function (a, v) { return a + v.cost; }, 0);

    var categoryStats = {};
    ended.forEach(function (c) {
      categoryStats[c.category] = categoryStats[c.category] || { completed: 0, notCompleted: 0 };
      categoryStats[c.category].completed += c.completed;
      categoryStats[c.category].notCompleted += c.notCompleted;
    });
    var categoryList = Object.keys(categoryStats).map(function (cat) {
      var s = categoryStats[cat];
      var rate = (s.completed + s.notCompleted) > 0 ? s.completed / (s.completed + s.notCompleted) : null;
      return { name: cat, rate: rate };
    }).filter(function (c) { return c.rate !== null; }).sort(function (a, b) { return b.rate - a.rate; });

    var internalEnded = ended.filter(function (c) { return c.vendor === 'Internal'; });
    var externalEnded = ended.filter(function (c) { return c.vendor !== 'Internal'; });
    function rateOf(list) {
      var c = list.reduce(function (a, x) { return a + x.completed; }, 0);
      var n = list.reduce(function (a, x) { return a + x.notCompleted; }, 0);
      return (c + n) > 0 ? c / (c + n) : null;
    }
    return {
      ended: ended, overallCompletionRate: overallCompletionRate, totalEnrollments: totalEnrollments,
      totalSpend: totalSpend, atRiskCourses: atRiskCourses, vendorList: vendorList,
      externalSpendTotal: externalSpendTotal, categoryList: categoryList,
      internalRate: rateOf(internalEnded), externalRate: rateOf(externalEnded)
    };
  }

  function buildInsights(courses, agg) {
    var insights = [];
    function push(priority, tone, tag, text) { insights.push({ priority: priority, tone: tone, tag: tag, text: text }); }

    courses.filter(function (c) { return c.phase === 'ended' && c.status.tone === 'warn'; })
      .sort(function (a, b) { return a.completionRate - b.completionRate; })
      .slice(0, 2)
      .forEach(function (c) {
        push(1, 'warn', 'At risk', '<strong>' + escapeHtml(c.name) + '</strong> finished at ' + Math.round(c.completionRate * 100) + '% completion (' + c.completed + ' of ' + (c.completed + c.notCompleted) + ') — the weakest result in the dataset.');
      });

    courses.filter(function (c) { return c.category === 'Compliance' && c.phase === 'ended' && c.completionRate !== null && c.completionRate < 0.85; })
      .forEach(function (c) {
        push(1, 'warn', 'Compliance risk', '<strong>' + escapeHtml(c.name) + '</strong> is a mandatory compliance course but closed at only ' + Math.round(c.completionRate * 100) + '% completion.');
      });

    courses.filter(function (c) { return c.phase === 'in-progress' && c.status.tone === 'caution'; })
      .forEach(function (c) {
        push(2, 'caution', 'Off pace', '<strong>' + escapeHtml(c.name) + '</strong> is ' + Math.round(c.elapsedFraction * 100) + '% through its schedule but trainees have logged only ' + Math.round((c.avgHours / c.hours) * 100) + '% of scheduled hours.');
      });

    if (agg.vendorList[0]) {
      var topVendor = agg.vendorList[0];
      var vendorPct = agg.externalSpendTotal > 0 ? Math.round((topVendor.cost / agg.externalSpendTotal) * 100) : 0;
      push(3, 'neutral', 'Vendor spend', '<strong>' + escapeHtml(topVendor.name) + '</strong> is the largest external provider at ' + fmtUSD(topVendor.cost) + ' across ' + topVendor.count + ' course' + (topVendor.count > 1 ? 's' : '') + ' (' + vendorPct + '% of external spend).');
    }

    if (agg.categoryList.length >= 2) {
      var worstCat = agg.categoryList[agg.categoryList.length - 1];
      var gap = Math.round((agg.overallCompletionRate - worstCat.rate) * 100);
      if (gap >= 12) {
        push(3, 'neutral', 'By category', '<strong>' + escapeHtml(worstCat.name) + '</strong> courses average ' + Math.round(worstCat.rate * 100) + '% completion, ' + gap + ' pts below the overall average of ' + Math.round(agg.overallCompletionRate * 100) + '%.');
      }
      var bestCat = agg.categoryList[0];
      if (bestCat.name !== worstCat.name) {
        push(4, 'good', 'Strong category', '<strong>' + escapeHtml(bestCat.name) + '</strong> leads all categories at ' + Math.round(bestCat.rate * 100) + '% average completion.');
      }
    }

    if (agg.internalRate !== null && agg.externalRate !== null && Math.abs(agg.internalRate - agg.externalRate) >= 0.08) {
      push(4, 'neutral', 'Internal vs. external', (agg.internalRate > agg.externalRate ? 'Internally-run' : 'Externally-procured') + ' courses average ' + Math.round(Math.max(agg.internalRate, agg.externalRate) * 100) + '% completion, versus ' + Math.round(Math.min(agg.internalRate, agg.externalRate) * 100) + '% for the other.');
    }

    insights.sort(function (a, b) { return a.priority - b.priority; });
    return insights;
  }

  function renderInsightCard(ins) {
    return '<div class="insight tone-' + ins.tone + '"><span class="stripe"></span><div class="body"><span class="tag">' + ins.tag + '</span><span class="text">' + ins.text + '</span></div></div>';
  }

  // =====================================================================
  // Rendering
  // =====================================================================

  var monthChartData = [];
  var TABLE_DATE_FMT = { month: 'short', day: 'numeric' };
  var catalogExpanded = false;

  function renderCourseRow(c) {
    var completionDisplay;
    if (c.phase === 'upcoming' || c.phase === 'unknown') {
      completionDisplay = '<span class="pct">—</span>';
    } else if (c.phase === 'in-progress') {
      var pacePct = c.hours > 0 ? Math.round((c.avgHours / c.hours) * 100) : 0;
      completionDisplay = '<div class="bar-track"><div class="bar-fill' + (c.status.tone === 'caution' ? ' caution' : '') + '" style="width:' + Math.min(100, pacePct) + '%"></div></div><span class="pct">' + pacePct + '%</span>';
    } else {
      var pct = c.completionRate === null ? 0 : Math.round(c.completionRate * 100);
      completionDisplay = '<div class="bar-track"><div class="bar-fill' + (c.status.tone === 'warn' ? ' warn' : c.status.tone === 'caution' ? ' caution' : '') + '" style="width:' + pct + '%"></div></div><span class="pct">' + pct + '%</span>';
    }
    return '<tr>' +
      '<td class="course-cell"><span class="name">' + escapeHtml(c.name) + '</span><span class="dates">' +
      (isNaN(c.startDate.getTime()) ? '—' : c.startDate.toLocaleDateString('en-US', TABLE_DATE_FMT)) + ' – ' + (isNaN(c.endDate.getTime()) ? '—' : c.endDate.toLocaleDateString('en-US', TABLE_DATE_FMT)) + '</span></td>' +
      '<td><span class="tag">' + escapeHtml(c.category) + '</span></td>' +
      '<td>' + escapeHtml(c.vendor) + '</td>' +
      '<td class="num-cell">' + c.hours + 'h</td>' +
      '<td class="num-cell">' + (c.cost > 0 ? fmtUSD(c.cost) : '—') + '</td>' +
      '<td class="num-cell">' + c.enrolled + '</td>' +
      '<td><div class="completion-cell">' + completionDisplay + '</div></td>' +
      '<td><span class="status tone-' + c.status.tone + '">' + escapeHtml(c.status.label) + '</span></td>' +
      '</tr>';
  }

  function renderVendorRow(v, maxCost) {
    var pct = Math.round((v.cost / maxCost) * 100);
    return '<div class="metric-row"><span class="metric-name">' + escapeHtml(v.name) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="metric-value">' + fmtUSD(v.cost) + '</span></div>';
  }

  function renderCategoryRow(cat) {
    var pct = Math.round(cat.rate * 100);
    return '<div class="metric-row"><span class="metric-name">' + escapeHtml(cat.name) + '</span><div class="bar-track"><div class="bar-fill' + (pct < 65 ? ' warn' : pct < 85 ? ' caution' : '') + '" style="width:' + pct + '%"></div></div><span class="metric-value">' + pct + '%</span></div>';
  }

  function setListNote(id, shownCount, totalCount, noun, hash) {
    var el = document.getElementById(id);
    if (!el) return;
    if (totalCount > shownCount) {
      el.innerHTML = 'Showing ' + shownCount + ' of ' + totalCount + ' ' + noun + '. <a href="' + hash + '">View all &rarr;</a>';
    } else {
      el.innerHTML = '<a href="' + hash + '">View all ' + noun + ' &rarr;</a>';
    }
    el.hidden = false;
  }

  function renderAll(state) {
    var today = new Date();
    var courses = (state.courses || []).map(function (c) { return enrichCourse(c, today); });
    var agg = computeAggregates(courses);
    var insights = buildInsights(courses, agg);

    // ---- stats ----
    var statsEl = document.getElementById('stats');
    var statCards = [
      { label: 'Completion rate', value: Math.round(agg.overallCompletionRate * 100), unit: '%', delta: { cls: agg.atRiskCourses.length ? 'warn' : 'up', text: agg.ended.length + ' ended courses' } },
      { label: 'Total enrollments', value: agg.totalEnrollments, unit: '', delta: { cls: 'up', text: 'across ' + courses.length + ' courses' } },
      { label: 'External spend', value: fmtUSD(agg.totalSpend), unit: '', delta: agg.vendorList[0] ? { cls: 'caution', text: escapeHtml(agg.vendorList[0].name) + ' largest vendor' } : null },
      { label: 'At-risk courses', value: agg.atRiskCourses.length, unit: agg.atRiskCourses.length === 1 ? 'course' : 'courses', delta: agg.atRiskCourses.length > 0 ? { cls: 'warn', text: 'see insights below' } : { cls: 'up', text: 'none flagged' } }
    ];
    statsEl.innerHTML = statCards.map(function (s) {
      return '<div class="stat"><div class="label">' + s.label + '</div><div class="value">' + s.value + (s.unit ? '<small>' + s.unit + '</small>' : '') + '</div>' +
        (s.delta ? '<span class="delta ' + s.delta.cls + '">' + s.delta.text + '</span>' : '') + '</div>';
    }).join('');

    // ---- insights ----
    var MAX_LIST = 5;
    var MAX_INSIGHTS = 6;
    var insightListEl = document.getElementById('insightList');
    if (insights.length === 0) {
      insightListEl.innerHTML = '<div class="insight tone-neutral"><span class="stripe"></span><div class="body"><span class="tag">Status</span><span class="text">Nothing notable — all courses within target.</span></div></div>';
    } else {
      insightListEl.innerHTML = insights.slice(0, MAX_INSIGHTS).map(renderInsightCard).join('');
    }
    setListNote('insightsNote', MAX_INSIGHTS, insights.length, 'insights', '#all-insights');
    var allInsightListEl = document.getElementById('allInsightList');
    if (allInsightListEl) {
      allInsightListEl.innerHTML = insights.length === 0
        ? '<div class="insight tone-neutral"><span class="stripe"></span><div class="body"><span class="tag">Status</span><span class="text">Nothing notable — all courses within target.</span></div></div>'
        : insights.map(renderInsightCard).join('');
    }

    // ---- monthly hours chart ----
    var allDates = [today];
    courses.forEach(function (c) {
      if (!isNaN(c.startDate.getTime())) allDates.push(c.startDate);
      if (!isNaN(c.endDate.getTime())) allDates.push(c.endDate);
    });
    var minD = new Date(Math.min.apply(null, allDates));
    var maxD = new Date(Math.max.apply(null, allDates));
    var months = [];
    var cursor = new Date(minD.getFullYear(), minD.getMonth(), 1);
    var endCursor = new Date(maxD.getFullYear(), maxD.getMonth(), 1);
    var guard = 0;
    while (cursor <= endCursor && guard < 48) {
      months.push({ start: new Date(cursor), end: new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0), label: cursor.toLocaleDateString('en-US', { month: 'short' }) });
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      guard++;
    }
    if (months.length > 12) months = months.slice(months.length - 12);

    monthChartData = months.map(function (mo) {
      var total = 0;
      courses.forEach(function (c) {
        if (c.totalHoursConsumed <= 0 || isNaN(c.startDate.getTime()) || isNaN(c.endDate.getTime())) return;
        var overlapStart = c.startDate > mo.start ? c.startDate : mo.start;
        var overlapEnd = c.endDate < mo.end ? c.endDate : mo.end;
        var overlapDays = Math.round((overlapEnd - overlapStart) / 86400000) + 1;
        if (overlapDays <= 0) return;
        var share = overlapDays / (c.durationDays + 1);
        total += c.totalHoursConsumed * share;
      });
      return total;
    });

    drawMonthChart();
    var labelsEl = document.getElementById('monthLabels');
    labelsEl.innerHTML = months.map(function (mo) { return '<span>' + mo.label + '</span>'; }).join('');

    // ---- course table ----
    var MAX_ROWS = 5;
    var rowsEl = document.getElementById('courseRows');
    var visibleCourses = catalogExpanded ? courses : courses.slice(0, MAX_ROWS);
    rowsEl.innerHTML = visibleCourses.map(renderCourseRow).join('');
    var catalogToggleBtn = document.getElementById('catalogToggleBtn');
    if (catalogToggleBtn) {
      if (courses.length > MAX_ROWS) {
        catalogToggleBtn.hidden = false;
        catalogToggleBtn.textContent = catalogExpanded ? 'Collapse Catalog' : 'Show All Courses (' + courses.length + ')';
      } else {
        catalogToggleBtn.hidden = true;
      }
    }

    var allRowsEl = document.getElementById('allCourseRows');
    if (allRowsEl) allRowsEl.innerHTML = courses.map(renderCourseRow).join('');
    var allCountEl = document.getElementById('allCourseCount');
    if (allCountEl) allCountEl.textContent = courses.length;

    // ---- vendor spend / category completion ----
    var maxVendorCost = Math.max.apply(null, agg.vendorList.map(function (v) { return v.cost; }).concat([1]));
    var vendorListEl = document.getElementById('vendorList');
    vendorListEl.innerHTML = agg.vendorList.slice(0, MAX_LIST).map(function (v) { return renderVendorRow(v, maxVendorCost); }).join('') || '<p class="sub">No external vendor spend in this dataset.</p>';
    setListNote('vendorNote', MAX_LIST, agg.vendorList.length, 'vendors', '#all-vendors');
    var allVendorListEl = document.getElementById('allVendorList');
    if (allVendorListEl) allVendorListEl.innerHTML = agg.vendorList.map(function (v) { return renderVendorRow(v, maxVendorCost); }).join('') || '<p class="sub">No external vendor spend in this dataset.</p>';
    var allVendorCountEl = document.getElementById('allVendorCount');
    if (allVendorCountEl) allVendorCountEl.textContent = agg.vendorList.length;

    var categoryListEl = document.getElementById('categoryList');
    categoryListEl.innerHTML = agg.categoryList.slice(0, MAX_LIST).map(renderCategoryRow).join('') || '<p class="sub">No ended courses yet.</p>';
    setListNote('categoryNote', MAX_LIST, agg.categoryList.length, 'categories', '#all-categories');
    var allCategoryListEl = document.getElementById('allCategoryList');
    if (allCategoryListEl) allCategoryListEl.innerHTML = agg.categoryList.map(renderCategoryRow).join('') || '<p class="sub">No ended courses yet.</p>';
    var allCategoryCountEl = document.getElementById('allCategoryCount');
    if (allCategoryCountEl) allCategoryCountEl.textContent = agg.categoryList.length;
  }

  function roundRectTop(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y); ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h);
    ctx.closePath();
  }

  function niceStep(rough) {
    rough = rough || 1;
    var mag = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10));
    var norm = rough / mag, step;
    if (norm <= 1) step = 1; else if (norm <= 2) step = 2; else if (norm <= 5) step = 5; else step = 10;
    return step * mag;
  }

  var chartGeom = null;
  var hoveredBarIndex = -1;

  function drawMonthChart() {
    var canvas = document.getElementById('monthChart');
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    var cssW = canvas.clientWidth || 640, cssH = 180;
    canvas.width = cssW * dpr; canvas.height = cssH * dpr;
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cssW, cssH);
    var border = getVar('--border'), muted = getVar('--muted'), accent = getVar('--accent'), accentStrong = getVar('--accent-strong');
    var dataMax = Math.max.apply(null, monthChartData.concat([1]));
    var step = niceStep(dataMax / 4);
    var axisMax = Math.max(step, Math.ceil(dataMax / step) * step);
    var tickCount = Math.round(axisMax / step);

    ctx.font = '500 10px "IBM Plex Mono", monospace';
    var topLabelWidth = ctx.measureText(Math.round(axisMax) + 'h').width;
    var padLeft = Math.ceil(topLabelWidth) + 12;
    var padTop = 16, padBottom = 8, padRight = 4;
    var plotH = cssH - padTop - padBottom;
    var plotW = cssW - padLeft - padRight;
    var n = monthChartData.length || 1, gap = 10;
    var barW = (plotW - gap * (n - 1)) / n;

    // gridlines + axis labels (hours)
    ctx.strokeStyle = border; ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (var t = 0; t <= tickCount; t++) {
      var val = t * step;
      var y = padTop + plotH * (1 - val / axisMax);
      ctx.beginPath(); ctx.lineWidth = 1;
      ctx.moveTo(padLeft, Math.round(y) + 0.5); ctx.lineTo(cssW - padRight, Math.round(y) + 0.5); ctx.stroke();
      ctx.fillText(Math.round(val) + 'h', padLeft - 8, y);
    }

    monthChartData.forEach(function (v, i) {
      var h = (v / axisMax) * plotH, x = padLeft + i * (barW + gap), y = cssH - padBottom - h;
      var isLast = i === n - 1, isHovered = i === hoveredBarIndex;
      ctx.fillStyle = (isLast || isHovered) ? accentStrong : accent;
      ctx.globalAlpha = (isLast || isHovered) ? 1 : 0.55 + (i / n) * 0.35;
      roundRectTop(ctx, x, y, barW, h, 3); ctx.fill();
      ctx.globalAlpha = 1;
    });

    chartGeom = { padLeft: padLeft, gap: gap, barW: barW, n: n, cssW: cssW };
    var labelsEl = document.getElementById('monthLabels');
    if (labelsEl) labelsEl.style.paddingLeft = padLeft + 'px';
  }

  function barIndexAtX(mouseX) {
    if (!chartGeom) return -1;
    var rel = mouseX - chartGeom.padLeft;
    if (rel < 0) return -1;
    var idx = Math.floor(rel / (chartGeom.barW + chartGeom.gap));
    if (idx < 0 || idx >= chartGeom.n) return -1;
    var xInStep = rel - idx * (chartGeom.barW + chartGeom.gap);
    if (xInStep > chartGeom.barW) return -1;
    return idx;
  }

  function wireChartHover() {
    var canvas = document.getElementById('monthChart');
    var wrap = canvas ? canvas.closest('.chart-wrap') : null;
    var tooltip = document.getElementById('chartTooltip');
    if (!canvas || !wrap || !tooltip) return;
    canvas.addEventListener('mousemove', function (e) {
      var rect = canvas.getBoundingClientRect();
      var mouseX = e.clientX - rect.left;
      var idx = barIndexAtX(mouseX);
      if (idx === hoveredBarIndex) { if (idx >= 0) positionTooltip(e, rect); return; }
      hoveredBarIndex = idx;
      drawMonthChart();
      if (idx >= 0) {
        var labelsEl = document.getElementById('monthLabels');
        var label = labelsEl && labelsEl.children[idx] ? labelsEl.children[idx].textContent : '';
        tooltip.textContent = (label ? label + ': ' : '') + Math.round(monthChartData[idx]) + 'h';
        tooltip.hidden = false;
        positionTooltip(e, rect);
      } else {
        tooltip.hidden = true;
      }
    });
    canvas.addEventListener('mouseleave', function () {
      hoveredBarIndex = -1;
      tooltip.hidden = true;
      drawMonthChart();
    });
    function positionTooltip(e, rect) {
      var wrapRect = wrap.getBoundingClientRect();
      tooltip.style.left = (e.clientX - wrapRect.left) + 'px';
      tooltip.style.top = (e.clientY - wrapRect.top - 10) + 'px';
    }
  }

  renderAll(STATE);
  wireChartHover();
  window.addEventListener('resize', drawMonthChart);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawMonthChart);

  // =====================================================================
  // Simple hash router: dashboard vs. full-list pages
  // =====================================================================

  var ROUTES = {
    '#main': 'view-main',
    '#what-are-my-courses': 'view-courses-lookup',
    '#login': 'view-login',
    '#dashboard': 'view-dashboard',
    '#all-insights': 'view-all-insights',
    '#all-vendors': 'view-all-vendors',
    '#all-categories': 'view-all-categories',
    '#all-courses': 'view-all-courses'
  };
  var ALL_VIEW_IDS = ['view-main', 'view-courses-lookup', 'view-login', 'view-dashboard', 'view-all-insights', 'view-all-vendors', 'view-all-categories', 'view-all-courses'];
  var GATED_VIEW_IDS = ['view-dashboard', 'view-all-insights', 'view-all-vendors', 'view-all-categories', 'view-all-courses'];
  var ADMIN_SESSION_KEY = 'meridianAdminSession';
  var ADMIN_USER = 'admin';
  var ADMIN_PASS = 'admin123';
  var pendingRedirectHash = null;

  function isAdmin() {
    try { return sessionStorage.getItem(ADMIN_SESSION_KEY) === '1'; } catch (e) { return false; }
  }
  function setAdminSession() {
    try { sessionStorage.setItem(ADMIN_SESSION_KEY, '1'); } catch (e) { /* no-op if storage is unavailable */ }
  }
  function clearAdminSession() {
    try { sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch (e) { /* no-op */ }
  }

  function updateAuthUI() {
    var admin = isAdmin();
    document.querySelectorAll('.nav-logout-group').forEach(function (el) { el.hidden = !admin; });
  }

  var lastViewId = null;

  function applyRoute() {
    var hash = location.hash || '#main';
    var targetId = ROUTES[hash] || 'view-main';
    if (GATED_VIEW_IDS.indexOf(targetId) !== -1 && !isAdmin()) {
      pendingRedirectHash = hash;
      targetId = 'view-login';
    }
    if (lastViewId === 'view-courses-lookup' && targetId !== 'view-courses-lookup') {
      resetRoleSearch();
    }
    if (lastViewId === 'view-login' && targetId !== 'view-login') {
      resetLoginForm();
    }
    ALL_VIEW_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.hidden = (id !== targetId);
    });
    lastViewId = targetId;
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', applyRoute);
  applyRoute();
  updateAuthUI();

  // =====================================================================
  // Admin login (demo only — client-side check, not real authentication)
  // =====================================================================

  function resetLoginForm() {
    var user = document.getElementById('loginUser');
    var pass = document.getElementById('loginPass');
    var errEl = document.getElementById('loginError');
    if (user) user.value = '';
    if (pass) pass.value = '';
    if (errEl) { errEl.hidden = true; errEl.textContent = ''; }
  }

  function initLogin() {
    var form = document.getElementById('loginForm');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('loginUser').value.trim();
      var pass = document.getElementById('loginPass').value;
      var errEl = document.getElementById('loginError');
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        setAdminSession();
        updateAuthUI();
        errEl.hidden = true;
        location.hash = pendingRedirectHash || '#dashboard';
        pendingRedirectHash = null;
        applyRoute();
      } else {
        errEl.textContent = 'Incorrect username or password.';
        errEl.hidden = false;
      }
    });
    document.querySelectorAll('.nav-logout-link').forEach(function (link) {
      link.addEventListener('click', function () {
        clearAdminSession();
        updateAuthUI();
      });
    });
  }
  initLogin();

  // =====================================================================
  // "What are my courses?" — role-to-course lookup
  // =====================================================================

  var ROLE_COURSES = {
    'Data Engineer': ['Cloud Infrastructure Fundamentals', 'Advanced Python for Data Teams', 'Kubernetes in Production'],
    'Data Scientist': ['Advanced Python for Data Teams', 'Kubernetes in Production'],
    'New People Manager': ['People Leadership Essentials', 'Coaching for New Managers', 'Information Security Awareness'],
    'Senior Manager': ['Executive Presence & Influence', 'Coaching for New Managers'],
    'Sales Representative': ['Consultative Selling Skills', 'Client Success Playbook', 'Information Security Awareness'],
    'Account Manager': ['Client Success Playbook', 'Consultative Selling Skills'],
    'Warehouse Associate': ['Warehouse Safety Certification', 'Forklift Operation & Handling', 'Fire Safety & Emergency Response'],
    'Warehouse Supervisor': ['Warehouse Safety Certification', 'Forklift Operation & Handling', 'Fire Safety & Emergency Response', 'Coaching for New Managers'],
    'Compliance Officer': ['Information Security Awareness', 'Anti-Bribery & Corruption', 'Data Privacy & GDPR Refresher'],
    'All Employees': ['Information Security Awareness', 'Data Privacy & GDPR Refresher', 'Anti-Bribery & Corruption'],
    'Client-Facing Consultant': ['Business Spanish for Client Teams', 'Consultative Selling Skills', 'Intercultural Communication'],
    'New Hire': ['Information Security Awareness', 'Data Privacy & GDPR Refresher', 'Warehouse Safety Certification']
  };

  var QUICK_ROLE_CHIPS = Object.keys(ROLE_COURSES).slice(0, 4);

  function findRoleMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    var roles = Object.keys(ROLE_COURSES);
    var exact = roles.filter(function (r) { return r.toLowerCase() === q; });
    if (exact.length) return exact;
    return roles.filter(function (r) { return r.toLowerCase().indexOf(q) !== -1; });
  }

  function renderRoleResults(query) {
    var resultsEl = document.getElementById('roleResults');
    if (!resultsEl) return;
    var roles = Object.keys(ROLE_COURSES);
    if (!query.trim()) {
      resultsEl.innerHTML = '<p class="role-empty">Start typing a role above, e.g. ' + roles.slice(0, 3).map(escapeHtml).join(', ') + '.</p>';
      return;
    }
    var matches = findRoleMatches(query);
    if (matches.length === 0) {
      resultsEl.innerHTML = '<p class="role-empty">No matching role found for "' + escapeHtml(query) + '". Try one of the suggestions in the box above.</p>';
      return;
    }
    if (matches.length > 1) {
      resultsEl.innerHTML = '<p class="role-empty">Multiple roles match "' + escapeHtml(query) + '" — did you mean: ' + matches.map(escapeHtml).join(', ') + '?</p>';
      return;
    }
    var role = matches[0];
    var byName = {};
    (STATE.courses || []).forEach(function (c) { byName[c.name] = c; });
    var items = ROLE_COURSES[role].map(function (name) {
      var c = byName[name];
      var meta = c ? '<span class="tag">' + escapeHtml(c.category) + '</span><span class="role-hours">' + c.hours + 'h</span>' : '';
      return '<div class="role-course-item"><span class="name">' + escapeHtml(name) + '</span><span class="role-course-meta">' + meta + '</span></div>';
    }).join('');
    resultsEl.innerHTML = '<p class="role-result-role">Required training for ' + escapeHtml(role) + '</p><div class="role-course-list">' + items + '</div>';
  }

  function bestRoleMatch(typed) {
    if (!typed) return null;
    var typedLower = typed.toLowerCase();
    return Object.keys(ROLE_COURSES).find(function (r) { return r.toLowerCase().indexOf(typedLower) === 0; }) || null;
  }

  function updateRoleGhost(input, ghost) {
    var typed = input.value;
    var match = bestRoleMatch(typed);
    var remainder = (match && match.length > typed.length) ? match.slice(typed.length) : '';
    ghost.querySelector('.typed').textContent = typed;
    ghost.querySelector('.remainder').textContent = remainder;
    return match;
  }

  function resetRoleSearch() {
    var input = document.getElementById('roleInput');
    var ghost = document.getElementById('roleGhost');
    if (!input || !ghost) return;
    input.value = '';
    updateRoleGhost(input, ghost);
    renderRoleResults('');
  }

  function renderRoleChips() {
    var row = document.getElementById('roleChipRow');
    var input = document.getElementById('roleInput');
    var ghost = document.getElementById('roleGhost');
    if (!row || !input || !ghost) return;
    row.innerHTML = QUICK_ROLE_CHIPS.map(function (role) {
      return '<button type="button" class="role-chip" data-role="' + escapeHtml(role) + '">' + escapeHtml(role) + '</button>';
    }).join('');
    row.querySelectorAll('.role-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        input.value = chip.getAttribute('data-role');
        updateRoleGhost(input, ghost);
        renderRoleResults(input.value);
        input.focus();
      });
    });
  }

  function initRoleSearch() {
    var form = document.getElementById('roleSearchForm');
    var input = document.getElementById('roleInput');
    var ghost = document.getElementById('roleGhost');
    if (!form || !input || !ghost) return;

    renderRoleChips();

    // Always start from a blank box on load — never restore a browser-cached value.
    resetRoleSearch();

    input.addEventListener('input', function () { updateRoleGhost(input, ghost); });
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' || e.shiftKey) return;
      var match = bestRoleMatch(input.value);
      if (match && match.length > input.value.length) {
        e.preventDefault();
        input.value = match;
        updateRoleGhost(input, ghost);
      }
    });
    form.addEventListener('submit', function (e) { e.preventDefault(); renderRoleResults(input.value); });
  }
  initRoleSearch();

  // =====================================================================
  // Dummy placeholder links on the main page
  // =====================================================================

  document.querySelectorAll('.dummy-link').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });

  // =====================================================================
  // Hamburger navigation menu — CSS shows it on hover/focus-within;
  // this just lets keyboard users dismiss it with Escape.
  // =====================================================================

  function initNavMenus() {
    // Clicking a button can leave it focused (varies by OS/browser), which would
    // keep :focus-within — and the menu — open after the mouse moves away.
    // Suppressing focus-on-mousedown avoids that while leaving Tab/keyboard focus intact.
    document.querySelectorAll('.hamburger-btn').forEach(function (btn) {
      btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var active = document.activeElement;
      if (active && active.closest && active.closest('.nav-menu-wrap')) active.blur();
    });
  }
  initNavMenus();

  // =====================================================================
  // Update-dataset modal
  // =====================================================================

  function initImportModal() {
    var backdrop = document.getElementById('importModalBackdrop');
    var openBtn = document.getElementById('openImportBtn');
    var closeBtn = document.getElementById('importModalClose');
    if (!backdrop || !openBtn || !closeBtn) return;

    function openModal() { backdrop.hidden = false; closeBtn.focus(); }
    function closeModal() { backdrop.hidden = true; }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !backdrop.hidden) closeModal();
    });
  }
  initImportModal();

  // =====================================================================
  // Course catalog expand/collapse toggle
  // =====================================================================

  function initCatalogToggle() {
    var btn = document.getElementById('catalogToggleBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      catalogExpanded = !catalogExpanded;
      renderAll(STATE);
    });
  }
  initCatalogToggle();

  // =====================================================================
  // Dashboard section anchor nav — intercepted so it scrolls in place
  // instead of changing location.hash (which the router treats as a route)
  // =====================================================================

  function initSectionNav() {
    var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('.section-nav a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var target = document.getElementById(a.getAttribute('href').slice(1));
        if (target) target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      });
    });
  }
  initSectionNav();

  // =====================================================================
  // Import UI
  // =====================================================================

  var pendingCourses = null;
  var importStatusEl = document.getElementById('importStatus');

  function setImportStatus(cls, html) {
    importStatusEl.className = 'import-status' + (cls ? ' ' + cls : '');
    importStatusEl.innerHTML = html;
    importStatusEl.hidden = false;
  }

  var fileInput = document.getElementById('csvInput');
  if (fileInput) fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var result = parseCourseRows(String(reader.result || ''));
      pendingCourses = result.courses.length ? result.courses : null;
      var parts = [];
      if (result.errors.length) {
        parts.push('<div class="summary">' + result.courses.length + ' course(s) parsed, ' + result.errors.length + ' error(s)' + (result.warnings.length ? ', ' + result.warnings.length + ' warning(s)' : '') + '</div>');
      } else if (result.warnings.length) {
        parts.push('<div class="summary">' + result.courses.length + ' course(s) parsed with ' + result.warnings.length + ' warning(s)</div>');
      } else {
        parts.push('<div class="summary">' + result.courses.length + ' course(s) parsed — looks good.</div>');
      }
      var issues = result.errors.concat(result.warnings);
      if (issues.length) parts.push('<ul class="import-list">' + issues.map(function (m) { return '<li>' + escapeHtml(m) + '</li>'; }).join('') + '</ul>');
      if (pendingCourses) {
        parts.push('<div class="import-actions"><button class="btn" id="saveImportBtn" type="button">Save update (' + pendingCourses.length + ' courses)</button><button class="btn-ghost" id="cancelImportBtn" type="button">Cancel</button></div>');
      }
      setImportStatus(result.errors.length ? 'error' : result.warnings.length ? 'warn' : 'ok', parts.join(''));

      var saveBtn = document.getElementById('saveImportBtn');
      if (saveBtn) saveBtn.addEventListener('click', function () {
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        applyAndSave(pendingCourses);
      });
      var cancelBtn = document.getElementById('cancelImportBtn');
      if (cancelBtn) cancelBtn.addEventListener('click', function () {
        pendingCourses = null;
        importStatusEl.hidden = true;
        fileInput.value = '';
      });
    };
    reader.onerror = function () { setImportStatus('error', '<div class="summary">Could not read that file.</div>'); };
    reader.readAsText(file);
  });

  function applyAndSave(courses) {
    var newState = { updatedAt: new Date().toISOString(), courses: courses };
    STATE = newState;
    renderAll(STATE);
    persist(newState);
  }

  function persist(state) {
    (function () {
      var capPromise = (window.claude && window.claude.use) ? window.claude.use('artifact').catch(function () { return null; }) : Promise.resolve(null);
      capPromise.then(function (cap) {
        if (!cap) { setImportStatus('warn', '<div class="summary">Saved to your view. This page can\'t persist the update for other viewers here.</div>'); return; }
        var html = buildFullHtml(state);
        cap.publish(html).then(function () {
          setImportStatus('ok', '<div class="summary">Saved — everyone who opens this dashboard will see the update.</div>');
        }, function (err) {
          var code = err && err.code;
          if (code === 'conflict') setImportStatus('warn', '<div class="summary">Someone updated this dashboard just now — reloading to the latest version.</div>');
          else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') setImportStatus('warn', '<div class="summary">You do not have edit access to save this for everyone. Your own view has been updated.</div>');
          else setImportStatus('warn', '<div class="summary">Could not save the update (' + (code || 'unknown error') + '). Your view has been updated locally.</div>');
        });
      });
    })();
  }

  var templateBtn = document.getElementById('templateBtn');
  if (templateBtn) templateBtn.addEventListener('click', function () {
    var csv = buildTemplateCSV(STATE.courses || []);
    var capPromise = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(function () { return null; }) : Promise.resolve(null);
    capPromise.then(function (dl) {
      if (!dl) { setImportStatus('warn', '<div class="summary">Downloads are not available in this view.</div>'); return; }
      dl.save({ filename: 'meridian-training-data.csv', data: csv }).catch(function (err) {
        var code = err && err.code;
        if (code === 'extension_not_enabled' || code === 'rejected_extension') {
          dl.save({ filename: 'meridian-training-data.txt', data: csv }).then(function () {
            setImportStatus('warn', '<div class="summary">Saved as .txt — rename the extension to .csv before editing in Excel.</div>');
          }).catch(function () { setImportStatus('warn', '<div class="summary">Could not save the template file.</div>'); });
        } else if (code !== 'declined') {
          setImportStatus('warn', '<div class="summary">Could not save the template file.</div>');
        }
      });
    });
  });

  // =====================================================================
  // Full-page template, used only when persisting via artifact.publish()
  // =====================================================================

  function buildFullHtml(state) {
    var dataJson = JSON.stringify(state).replace(/</g, '\\u003c');
    var appSrc = appMain.toString();
    return '<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n' +
      '<title>Meridian Training Ops</title>\n' +
      '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n' +
      '<meta http-equiv="Pragma" content="no-cache">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">\n' +
      '<style id="app-style"></style>\n</head>\n<body>\n<div id="app-root"></div>\n' +
      '<script id="data-store" type="application/json">' + dataJson + '<' + '/script>\n' +
      '<script>(' + appSrc + ')();<' + '/script>\n</body>\n</html>';
  }
})();
</script>
